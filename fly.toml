app = "cerne-oss"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data/pgdata"
  TRUST_PROXY = "true"
  SEED_SAMPLE_PROJECT = "true"
  LLM_BASE_URL = "https://api.openai.com/v1"
  LLM_MODEL = "gpt-4o-mini"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "cerne_data"
  destination = "/data"